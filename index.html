<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chef Lombrique 🪱</title>

<style>

:root {
    --bg-page: #fafafa;

    --recommande: #e8f5e9;
    --acceptable: #f1f8e9;
    --moderation: #fff8e1;
    --eviter: #ffebee;

    --azote: #388e3c;
    --carbone: #795548;
    --mixte: #1976d2;
}

body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f5f5f5;
}

h1{
    text-align: center;
    font-size: 3rem;
    margin-bottom: 30px;
}

#recherche{
    width: 100%;
    max-width: 600px;
    padding: 12px;
    font-size: 1.2rem;
    margin-bottom: 20px;
}

#compteur{
    font-weight: bold;
    margin-bottom: 15px;
}

table{
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th{
    background: #efefef;
    padding: 15px;
    border: 1px solid #d0d0d0;
    font-size: 1.2rem;
}

td{
    padding: 12px;
    border: 1px solid #d0d0d0;
}

.recommande{
    background-color: var(--recommande);
}

.acceptable{
    background-color: var(--acceptable);
}

.moderation{
    background-color: var(--moderation);
}

.eviter{
    background-color: var(--eviter);
}

.carbone{
    color: var(--carbone);
    font-weight: bold;
}

.azote{
    color: var(--azote);
    font-weight: bold;
}

.mixte{
    color: var(--mixte);
    font-weight: bold;
}

#legende{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    margin-bottom:20px;
}

.item-legende{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
}

.couleur{
    width:20px;
    height:20px;
    display:inline-block;
    border:1px solid #999;
}

.couleur.recommande{
    background:var(--recommande);
}

.couleur.acceptable{
    background:var(--acceptable);
}

.couleur.moderation{
    background:var(--moderation);
}

.couleur.eviter{
    background:var(--eviter);
}

</style>

</head>

<body>

<h1>🪱 Chef Lombrique</h1>

<input
type="text"
id="recherche"
placeholder="Rechercher un aliment..."
>

<p id="compteur"></p>

<div id="legende">

    <div class="item-legende">
        <span class="couleur recommande"></span>
        Recommandé
    </div>

    <div class="item-legende">
        <span class="couleur acceptable"></span>
        Acceptable
    </div>

    <div class="item-legende">
        <span class="couleur moderation"></span>
        Modération
    </div>

    <div class="item-legende">
        <span class="couleur eviter"></span>
        À éviter
    </div>

</div>

<table>

<thead>
<tr>
    <th>Aliment</th>
    <th>Apport</th>
    <th>Pourquoi</th>
</tr>
</thead>

<tbody id="tableau"></tbody>

</table>

<script>

let aliments = [];

fetch("aliments.json")
.then(response => response.json())
.then(data => {
    aliments = data;
    afficher();
});

document
.getElementById("recherche")
.addEventListener("input", afficher);

function afficher(){

    const filtre =
        document
        .getElementById("recherche")
        .value
        .toLowerCase();

    const resultats = aliments.filter(aliment =>
        aliment.nom.toLowerCase().includes(filtre)
    );

    document.getElementById("compteur").innerText =
        `${resultats.length} aliment(s) trouvé(s)`;

    const tableau =
        document.getElementById("tableau");

    tableau.innerHTML = "";

    resultats.forEach(aliment => {

        let statutClasse = "";

        switch(aliment.statut){
            case "Recommandé":
                statutClasse = "recommande";
                break;

            case "Acceptable":
                statutClasse = "acceptable";
                break;

            case "Modération":
                statutClasse = "moderation";
                break;

            case "À éviter":
                statutClasse = "eviter";
                break;
        }

        let apportClasse = "";

        switch(aliment.apport){
            case "Carbone":
                apportClasse = "carbone";
                break;

            case "Azote":
                apportClasse = "azote";
                break;

            case "Mixte":
                apportClasse = "mixte";
                break;
        }

        tableau.innerHTML += `
            <tr class="${statutClasse}">
                <td>${aliment.nom}</td>
                <td class="${apportClasse}">
                    ${aliment.apport}
                </td>
                <td>${aliment.details}</td>
            </tr>
        `;
    });
}

</script>

</body>
</html>
